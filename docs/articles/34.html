  <section class="panel">
    <h2>文法重點</h2>
    <ul class="grammar-list">
      
      <li>
        <strong>名詞修飾名詞</strong>
        <div class="example">
          <button class="btn-say" type="button" data-text="EDITORIAL CARTOON" title="朗讀例句">🔊</button>
          EDITORIAL CARTOON
        </div>
        <div class="explanation">由兩個名詞串聯，前面的名詞（editorial）在此作為形容詞用，用來修飾後面的中心名詞（cartoon），說明該漫畫的屬性是屬於社論性質的。</div>
      </li>
      
    </ul>
